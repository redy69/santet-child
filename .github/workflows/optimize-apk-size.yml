name: SantetHP APK size optimization validation
on:
  push:
    branches:
      - optimization/apk-size-build-719
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v4
      - name: Install SantetHP icon assets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/santethp-icons"
          curl -fL "https://raw.githubusercontent.com/redy69/ParentAudioConnect/b164ed1a75a7bece1e1a840b9ac5670055aca8d7/screenshot/icon.zip" -o "$RUNNER_TEMP/santethp-icons/icon.zip"
          unzip -q "$RUNNER_TEMP/santethp-icons/icon.zip" -d "$RUNNER_TEMP/santethp-icons"
          mkdir -p app/src/main/res/raw app/src/main/res/drawable-nodpi
          cp "$RUNNER_TEMP/santethp-icons/icon/notification.gif" app/src/main/res/raw/notification_icon.gif
          cp "$RUNNER_TEMP/santethp-icons/icon/whatsapp.png" app/src/main/res/drawable-nodpi/whatsapp_icon.png
          cp "$RUNNER_TEMP/santethp-icons/icon/wifi.png" app/src/main/res/drawable-nodpi/wifi_icon.png
          curl -fL "https://raw.githubusercontent.com/redy69/ParentAudioConnect/49a6dc86eb92eed40871adfb77962d027fcb0294/screenshot/icon1.zip" -o "$RUNNER_TEMP/santethp-icons/icon1.zip"
          unzip -q "$RUNNER_TEMP/santethp-icons/icon1.zip" -d "$RUNNER_TEMP/santethp-icons"
          cp "$RUNNER_TEMP/santethp-icons/icon1/baterai.png" app/src/main/res/drawable-nodpi/battery_icon.png
          cp "$RUNNER_TEMP/santethp-icons/icon1/wifi-router.png" app/src/main/res/drawable-nodpi/wifi_icon.png
          cp "$RUNNER_TEMP/santethp-icons/icon1/signal.png" app/src/main/res/drawable-nodpi/signal_icon.png
      - name: Install icon2 menu images
        run: |
          set -euo pipefail
          ICON_DIR="screenshot/icon2-inspection/extracted/icon2"
          mkdir -p app/src/main/res/drawable-nodpi
          test -d "$ICON_DIR"
          cp "$ICON_DIR/add.png" app/src/main/res/drawable-nodpi/menu_add_icon.png
          cp "$ICON_DIR/audio.png" app/src/main/res/drawable-nodpi/menu_audio_icon.png
          cp "$ICON_DIR/blocked.png" app/src/main/res/drawable-nodpi/menu_blocked_icon.png
          cp "$ICON_DIR/boy.png" app/src/main/res/drawable-nodpi/menu_boy_icon.png
          cp "$ICON_DIR/camera.png" app/src/main/res/drawable-nodpi/menu_camera_icon.png
          cp "$ICON_DIR/galeri.png" app/src/main/res/drawable-nodpi/menu_gallery_icon.png
          cp "$ICON_DIR/map.png" app/src/main/res/drawable-nodpi/menu_map_icon.png
          cp "$ICON_DIR/mp3.png" app/src/main/res/drawable-nodpi/menu_mp3_icon.png
          cp "$ICON_DIR/server.png" app/src/main/res/drawable-nodpi/menu_server_icon.png
          cp "$ICON_DIR/whatsapp.png" app/src/main/res/drawable-nodpi/menu_whatsapp_icon.png
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test Firestore rules
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx firebase emulators:exec --only firestore --project demo-santethp "npm run test:rules"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools'
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build R8-minified Anak and Ortu debug APKs
        run: gradle :app:assembleAnakDebug :app:assembleOrtuDebug -PversionCode=720
      - name: Report APK sizes
        run: |
          set -euo pipefail
          find app/build/outputs/apk -type f -name "*.apk" -print -exec du -b {} +
      # Debug builds are validated and size-reported, not offered as downloads.
      - name: Create temporary validation signing key
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/santethp-validation.jks" -storepass "ValidationOnly-720" -keypass "ValidationOnly-720" -alias santethp-validation -keyalg RSA -keysize 2048 -validity 2 -dname "CN=SantetHP Validation, OU=CI, O=SantetHP, L=Semarang, ST=Central Java, C=ID"
      - name: Build minified release APKs with temporary validation signature
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/santethp-validation.jks
          ANDROID_KEYSTORE_PASSWORD: ValidationOnly-720
          ANDROID_KEY_ALIAS: santethp-validation
          ANDROID_KEY_PASSWORD: ValidationOnly-720
          METERED_TURN_API_KEY: ${{ secrets.METERED_TURN_API_KEY }}
        run: |
          set -euo pipefail
          gradle :app:assembleAnakRelease :app:assembleOrtuRelease -PversionCode=720
      - name: Report release APK sizes
        run: |
          set -euo pipefail
          find app/build/outputs/apk/anak/release app/build/outputs/apk/ortu/release -type f -name "*.apk" -print -exec du -b {} +
      - name: Upload anak arm64-v8a release APK separately
        uses: actions/upload-artifact@v4
        with:
          name: SantetHP-anak-arm64-v8a-release-validation
          path: app/build/outputs/apk/anak/release/app-anak-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload anak armeabi-v7a release APK separately
        uses: actions/upload-artifact@v4
        with:
          name: SantetHP-anak-armeabi-v7a-release-validation
          path: app/build/outputs/apk/anak/release/app-anak-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload anak x86 release APK separately
        uses: actions/upload-artifact@v4
        with:
          name: SantetHP-anak-x86-release-validation
          path: app/build/outputs/apk/anak/release/app-anak-x86-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload anak x86_64 release APK separately
        uses: actions/upload-artifact@v4
        with:
          name: SantetHP-anak-x86_64-release-validation
          path: app/build/outputs/apk/anak/release/app-anak-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload anak universal release APK separately
        uses: actions/upload-artifact@v4
        with:
          name: SantetHP-anak-universal-release-validation
          path: app/build/outputs/apk/anak/release/app-anak-universal-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload ortu arm64-v8a release APK separately
        uses: actions/upload-artifact@v4
        with:
          name: SantetHP-ortu-arm64-v8a-release-validation
          path: app/build/outputs/apk/ortu/release/app-ortu-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload ortu armeabi-v7a release APK separately
        uses: actions/upload-artifact@v4
        with:
          name: SantetHP-ortu-armeabi-v7a-release-validation
          path: app/build/outputs/apk/ortu/release/app-ortu-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload ortu x86 release APK separately
        uses: actions/upload-artifact@v4
        with:
          name: SantetHP-ortu-x86-release-validation
          path: app/build/outputs/apk/ortu/release/app-ortu-x86-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload ortu x86_64 release APK separately
        uses: actions/upload-artifact@v4
        with:
          name: SantetHP-ortu-x86_64-release-validation
          path: app/build/outputs/apk/ortu/release/app-ortu-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload ortu universal release APK separately
        uses: actions/upload-artifact@v4
        with:
          name: SantetHP-ortu-universal-release-validation
          path: app/build/outputs/apk/ortu/release/app-ortu-universal-release.apk
          if-no-files-found: error
          retention-days: 30
